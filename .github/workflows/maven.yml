name: Java CI with Maven

on:
  push:
    branches: [ "master"]
  pull_request:
    branches: [ "master"]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn package --file pom.xml

      # List files 
      - name: List files
        run: |
          cmd /c dir /s /b /o:gn

      # Upload Installer
      - name: Upload Jar
        uses: actions/upload-artifact@v3.1.0
        with:
          name: Fonlar.jar
          path: "D:/a/Fonlar/Fonlar/out/Fonlar-1.2-SNAPSHOT.jar"
